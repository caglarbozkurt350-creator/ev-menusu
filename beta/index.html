<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<title>Ev Menüsü · beta</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--zemin:#F4F5F9;--kart:#FFFFFF;--cizgi:#E4E6EE;--metin:#1A1C23;--metin2:#6B7180;--ton:.14;--mercan:#FF7A59;--turkuaz:#12B5A9;--yesil:#1FAF7A;--kirmizi:#E8475A;--pembe:#E0559C;--mor:#7C6CF0;--sari:#E39A12;--golge:0 1px 2px rgba(0,0,0,.04)}
html.koyu{--zemin:#12141A;--kart:#1C1F27;--cizgi:#2A2D36;--metin:#F2F3F7;--metin2:#9AA0AE;--ton:.18;--turkuaz:#22D3C5;--yesil:#34D399;--kirmizi:#FF5C6C;--pembe:#F472B6;--mor:#A78BFA;--sari:#F5B83D;--golge:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--zemin);color:var(--metin);font-family:'Outfit',system-ui,sans-serif;padding-bottom:110px}
body.kilit{overflow:hidden;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:active{transform:scale(.94)}
.ust{position:sticky;top:0;z-index:20;background:var(--zemin);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.ustsat{display:flex;align-items:center;gap:10px}
.kare{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);display:grid;place-items:center;font-size:20px;padding:0}
.baslik{flex:1;min-width:0}
.baslik small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--metin2);text-transform:uppercase}
.baslik h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.filtre{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.cip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);font-size:13.5px;font-weight:600;color:var(--metin2)}
.cip.on{border-color:transparent;background:color-mix(in srgb,var(--yesil) 20%,transparent);color:var(--yesil)}
main{padding:0 16px}
.bolum{scroll-margin-top:130px}
.bolum h2{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--metin2);text-transform:uppercase}
.bolum h2 span.ik{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.kartlar{display:flex;flex-direction:column;gap:8px}
.yk{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--kart);border:1px solid var(--cizgi);box-shadow:var(--golge)}
.yk.secili{border-color:color-mix(in srgb,var(--mercan) 60%,transparent)}
.foto{flex:none;width:76px;height:76px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:32px;position:relative}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.foto img.ok{opacity:1}
.yb{flex:1;min-width:0}
.yb b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.etk{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.et{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.et.s{background:color-mix(in srgb,var(--yesil) 18%,transparent);color:var(--yesil)}
.et.h{background:color-mix(in srgb,var(--turkuaz) 18%,transparent);color:var(--turkuaz)}
.et.y{background:color-mix(in srgb,var(--kirmizi) 18%,transparent);color:var(--kirmizi)}
.et.a{background:color-mix(in srgb,var(--sari) 20%,transparent);color:var(--sari)}
.et.t{background:color-mix(in srgb,var(--pembe) 18%,transparent);color:var(--pembe)}
.ogn{display:flex;gap:4px;margin-top:5px}
.ogn span{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:color-mix(in srgb,var(--mercan) 18%,transparent);color:var(--mercan)}
.arti{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--turkuaz);background:transparent;color:var(--turkuaz);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.yk.secili .arti{background:var(--mercan);border-color:var(--mercan);color:#fff;font-size:18px}
.alt{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-radius:22px;background:var(--mercan);color:#1A0E0A;text-align:left}
.alt b{display:block;font-size:16px}
.alt small{font-size:13px;font-weight:500}
.ort{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.ort.ac{opacity:1;pointer-events:auto}
.cekmece{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(300px,82vw);background:var(--zemin);border-right:1px solid var(--cizgi);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;overscroll-behavior:contain}
.cekmece.ac{transform:none}
.cekmece h3{margin:0 0 14px;font-size:20px;font-weight:700}
.kt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ktb{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:18px;border:1px solid var(--cizgi);background:var(--kart);text-align:left;font-size:13.5px;font-weight:600;min-height:92px;position:relative}
.ktb .ik{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.ktb em{position:absolute;top:10px;right:10px;font-style:normal;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--mercan);color:#fff}
.alttab{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--kart);border-top:1px solid var(--cizgi);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.alttab.ac{transform:none}
.tut{width:44px;height:5px;border-radius:9px;background:var(--cizgi);margin:0 auto 12px}
.alttab h3{margin:0;font-size:20px;font-weight:700}
.sat{display:flex;align-items:center;gap:10px}
.ogs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.ob{padding:14px 6px;border-radius:18px;border:1.5px solid var(--cizgi);background:var(--zemin);font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.ob span{font-size:22px}
.ob.on{border-color:var(--mercan);background:color-mix(in srgb,var(--mercan) 16%,transparent);color:var(--mercan)}
.buyuk{width:100%;height:170px;border-radius:20px;overflow:hidden;position:relative;display:grid;place-items:center;font-size:60px;margin-top:12px}
.buyuk img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mlz{list-style:none;margin:8px 0 0;padding:0}
.mlz li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--cizgi);font-size:15px}
.mlz li:last-child{border-bottom:0}
.mlz li span.m{margin-left:auto;color:var(--metin2);font-weight:600;white-space:nowrap}
.mlz li.var{opacity:.45}
.mlz li.var .ad{text-decoration:line-through}
.kutu{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--cizgi);display:grid;place-items:center;font-size:14px;padding:0;background:transparent}
.var .kutu{background:var(--yesil);border-color:var(--yesil);color:#fff}
.dugme{flex:1;height:52px;border-radius:16px;border:1px solid var(--cizgi);background:var(--zemin);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.dugme.ana{background:var(--mercan);border-color:var(--mercan);color:#1A0E0A}
.dugme.wa{background:#25D366;border-color:#25D366;color:#06210f;text-decoration:none}
.kisi{display:flex;align-items:center;gap:6px;padding:4px;border-radius:999px;border:1px solid var(--cizgi);background:var(--zemin)}
.kisi button{width:34px;height:34px;border-radius:50%;border:0;background:var(--kart);font-size:18px;font-weight:700;padding:0}
.kisi b{min-width:54px;text-align:center;font-size:14px}
.blk{margin-top:16px;padding:14px;border-radius:20px;background:var(--zemin);border:1px solid var(--cizgi)}
.blk h4{margin:0 0 6px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--metin2);display:flex;align-items:center;gap:8px}
.ys{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;font-weight:500}
.ys button{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--cizgi);background:var(--kart);padding:0;font-size:14px;color:var(--metin2)}
.sek{display:flex;padding:4px;border-radius:14px;background:var(--zemin);border:1px solid var(--cizgi);margin-top:16px}
.sek button{flex:1;height:38px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:600;color:var(--metin2)}
.sek button.on{background:var(--kart);color:var(--metin);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bos{text-align:center;color:var(--metin2);padding:30px 10px;font-size:15px}
.not{font-size:12.5px;color:var(--metin2);line-height:1.5;margin-top:12px}
.tost{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--metin);color:var(--zemin);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:all .25s;max-width:90vw;text-align:center}
.tost.ac{opacity:1;transform:translate(-50%,0)}
.kaynak{text-align:center;font-size:12px;color:var(--metin2);margin:26px 0 0}
.beta{font-size:11px;font-weight:700;letter-spacing:.08em;vertical-align:middle;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--mor) 20%,transparent);color:var(--mor);text-transform:uppercase}
.hafta{display:flex;align-items:center;gap:6px;margin-top:12px}
.ok{flex:none;width:30px;height:58px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);font-size:20px;padding:0;color:var(--metin2)}
.gunler{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gn{height:58px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--metin2)}
.gn b{font-size:17px;color:var(--metin)}
.gn i{display:flex;gap:2px;height:6px;font-style:normal}
.gn i span{width:6px;height:6px;border-radius:50%;background:var(--cizgi)}
.gn i span.d{background:var(--mercan)}
.gn.bugun{border-color:color-mix(in srgb,var(--turkuaz) 70%,transparent)}
.gn.sec{background:var(--mercan);border-color:var(--mercan);color:#1A0E0A}
.gn.sec b{color:#1A0E0A}
.gn.sec i span{background:rgba(26,14,10,.25)}.gn.sec i span.d{background:#1A0E0A}
.tarif{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;border:1px solid var(--cizgi);background:var(--zemin);color:var(--metin);font-weight:700;font-size:15px;text-decoration:none;margin-top:12px}
.ys .deg{margin-left:auto}
.ys .deg+button{margin-left:6px}
.gb{margin:18px 0 0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.gb small{font-size:12.5px;color:var(--metin2);font-weight:600}
.secb{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;border:1px solid var(--cizgi);background:var(--zemin);text-align:left;margin-top:10px}
.secb span.ik{font-size:28px}
.secb b{display:block;font-size:16px}
.secb small{font-size:13px;color:var(--metin2);font-weight:500}
</style>
</head>
<body>

  <div class="ustsat">
    <button class="kare" id="menuAc" aria-label="Kategoriler">☰</button>

  </div>
</header>
<main id="liste"></main>

<div class="ort" id="ort"></div>

/* Fotoğraflar: Wikipedia özet API'sinden küçük resim */
const fotoBellek=oku("evmenu.foto",{});
const bekleyen={};
async function fotoBul(y){
  if(fotoBellek[y.id]!==undefined)return fotoBellek[y.id];
  if(bekleyen[y.id])return bekleyen[y.id];
  bekleyen[y.id]=(async()=>{
    for(const w of y.w){const [dil,...b]=w.split(":");const baslik=b.join(":");
      try{const r=await fetch(`https://${dil}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(baslik.replace(/ /g,"_"))}`);
        if(!r.ok)continue;const j=await r.json();
        if(j.type==="disambiguation")continue;
        const u=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source);
        if(u){fotoBellek[y.id]=u;yaz("evmenu.foto",fotoBellek);return u}
      }catch(e){return null}}
    fotoBellek[y.id]="";yaz("evmenu.foto",fotoBellek);return "";
  })();
  return bekleyen[y.id];
}
function fotoYukle(img,id){fotoBul(YID[id]).then(u=>{if(u){img.onload=()=>img.classList.add("ok");img.src=u}})}
const gozlem="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){gozlem.unobserve(e.target);fotoYukle(e.target,e.target.dataset.id)}}),{rootMargin:"300px"}):{observe:i=>fotoYukle(i,i.dataset.id)};

function miktar(q,b){
  let x=q*D.kisi/2;
  if(b==="g"||b==="ml"){x=x>=100?Math.round(x/10)*10:Math.max(5,Math.round(x/5)*5);return x+" "+b}
  x=Math.max(.5,Math.round(x*2)/2);
  const tam=Math.floor(x),yarim=x-tam?"½":"";
  return (tam?tam:"")+yarim+" "+(BIRIM[b]||b);
}

function rastgele(katlar,u,haric){

  const s=gunS(g);let n=0;
  if(!s.kahvalti.length&&!gecti(g,"kahvalti")){[rastgele(["kahvalti"],u),kahvaltiIcecek()].forEach(id=>{if(id){s.kahvalti.push(id);n++}})}
  if(!s.ogle.length&&!gecti(g,"ogle")){[rastgele(YAN,u),rastgele(OGLEANA,u)].forEach(id=>{if(id){s.ogle.push(id);n++}})}
  if(!s.aksam.length&&!gecti(g,"aksam")){[rastgele(["corba"],u),rastgele(ANA,u),rastgele(["salata","aperatif"],u)].forEach(id=>{if(id){s.aksam.push(id);n++}})}
  return n;
}
$("#secBtn").onclick=()=>{
  const T=$("#secTab"),son=ekle(pzt(D.gun),6);
  const kalan=haftaGunleri().filter(g=>g>=bugun);
  T.innerHTML=`<div class="tut"></div><h3>🎲 Benim için seç</h3>
  <p class="not" style="margin-top:6px">Sadece <b>boş öğünleri</b> doldurur; bugünün saati geçmiş öğünlerini atlar (kahvaltı 11:00, öğle 15:00, akşam 21:00 sonrası). "Bana uygun" yemeklerden seçer (yumurtasız, şekere uygun, ağır olmayan) ve aynı yemeği hafta içinde tekrar etmemeye çalışır.</p>
  <button class="secb" id="sGun"><span class="ik">📅</span><span><b>${gunAdi(D.gun)} doldur</b><small>${kisaTarih(D.gun)} · kahvaltı, öğle, akşam</small></span></button>
  <button class="secb" id="sHafta"><span class="ik">🗓️</span><span><b>Haftanın kalanını doldur</b><small>${kalan.length?`${kisaTarih(kalan[0])} – ${kisaTarih(son)} · ${kalan.length} gün`:"Bu haftada kalan gün yok"}</small></span></button>
  <p class="not">Beğenmediğin yemeği menü ekranında 🔄 ile değiştirebilirsin.</p>`;
  T.querySelector("#sGun").onclick=()=>{const n=gunuDoldur(D.gun,kullanilan());kaydet();kapat();tost(n?`${n} yemek seçildi`:"Bu günün öğünleri zaten dolu")};
  T.querySelector("#sHafta").onclick=()=>{if(!kalan.length){tost("Bu haftada kalan gün yok");return}const u=kullanilan();let n=0;kalan.forEach(g=>n+=gunuDoldur(g,u));kaydet();kapat();tost(n?`${n} yemek seçildi`:"Kalan günler zaten dolu")};
  T.classList.add("ac");kilit(true);
};
function degistir(g,o,id){
  const y=YID[id],u=kullanilan(),s=gunS(g);
  let katlar=[y.kat];
  const yeni=rastgele(katlar,u,[id]);
  if(!yeni){tost("Bu kategoride başka uygun yemek yok");return}
  s[o]=s[o].map(x=>x===id?yeni:x);kaydet();menuCiz();tost(`${y.ad} → ${YID[yeni].ad}`);
}

/* Malzeme hesabı */
function malzemeler(ss){
  const m={};
  ss.forEach(({y})=>y.m.forEach(x=>{const k=(x.n+"|"+x.b).toLocaleLowerCase("tr");if(!m[k])m[k]={n:x.n,b:x.b,q:0,k};m[k].q+=x.q}));
  return Object.values(m).sort((a,b)=>a.n.localeCompare(b.n,"tr"));
}
const kapsamGunleri=()=>D.kapsam==="hafta"?haftaGunleri():[D.gun];
const evdeKey=()=>D.kapsam==="hafta"?"h:"+pzt(D.gun):"g:"+D.gun;
const evde=()=>D.evde[evdeKey()]||[];
const kapsamBaslik=()=>D.kapsam==="hafta"?`${kisaTarih(pzt(D.gun))} – ${kisaTarih(ekle(pzt(D.gun),6))} haftası`:uzunTarih(D.gun);
function gruplar(){
  const gs=kapsamGunleri(),ss=secimler(gs);
  if(D.gorunum==="toplu")return [{baslik:D.kapsam==="hafta"?"Haftalık alışveriş listesi":"Toplu alışveriş listesi",ik:"🛒",liste:malzemeler(ss)}];
  if(D.kapsam==="hafta")return gs.map(g=>({baslik:gunAdi(g)+" · "+kisaTarih(g),ik:"📅",liste:malzemeler(ss.filter(x=>x.g===g))})).filter(x=>x.liste.length);
  return OGUN.map(o=>({baslik:o[1]+" malzemeleri",ik:o[2],liste:malzemeler(ss.filter(x=>x.o===o[0]))})).filter(x=>x.liste.length);
}

function menuAc(){menuCiz();$("#menuTab").classList.add("ac");kilit(true);$("#menuTab").scrollTop=0}
$("#menuBtn").onclick=menuAc;
function menuCiz(){
  const T=$("#menuTab"),gs=kapsamGunleri(),ss=secimler(gs),ev=evde();
  let h=`<div class="tut"></div><div class="sat"><div style="flex:1"><h3>${D.kapsam==="hafta"?"Haftalık menü":gunAdi(D.gun)+" menüsü"}</h3><div style="font-size:13px;color:var(--metin2);font-weight:500">${kapsamBaslik()}</div></div>
  <div class="kisi"><button id="ke" aria-label="Kişi azalt">−</button><b>${D.kisi} kişi</b><button id="ka" aria-label="Kişi artır">+</button></div></div>
  <div class="sek" style="margin-top:14px"><button data-k="gun" class="${D.kapsam==="gun"?"on":""}">📅 Gün</button><button data-k="hafta" class="${D.kapsam==="hafta"?"on":""}">🗓️ Hafta</button></div>`;
  if(!ss.length){T.innerHTML=h+`<div class="bos">${D.kapsam==="hafta"?"Bu haftaya":"Bu güne"} henüz yemek seçmedin.<br>Bir yemeğin + düğmesine bas ya da 🎲 Benim için seç'i dene.</div><div class="sat"><button class="dugme" id="kpt">Menüye dön</button></div>`;
    T.querySelector("#kpt").onclick=kapat;baglaUst(T);return}
  gs.forEach(g=>{const gl=ss.filter(x=>x.g===g);if(!gl.length)return;
    if(D.kapsam==="hafta")h+=`<div class="gb">📅 ${gunAdi(g)} <small>${kisaTarih(g)}</small></div>`;
    OGUN.forEach(o=>{const l=gl.filter(x=>x.o===o[0]);if(!l.length)return;
      h+=`<div class="blk"><h4>${o[2]} ${o[1]}</h4>${l.map(x=>`<div class="ys"><span>${emo(x.y.kat)}</span>${x.y.ad}<button class="deg" data-deg="${g}|${o[0]}|${x.y.id}" aria-label="Değiştir">🔄</button><button data-sil="${g}|${o[0]}|${x.y.id}" aria-label="Çıkar">✕</button></div>`).join("")}</div>`})});
  h+=`<div class="sek"><button data-g="ayri" class="${D.gorunum!=="toplu"?"on":""}">${D.kapsam==="hafta"?"Gün gün":"Öğün öğün"}</button><button data-g="toplu" class="${D.gorunum==="toplu"?"on":""}">Toplu liste</button></div>`;
  gruplar().forEach(gr=>{h+=`<div class="blk"><h4>${gr.ik} ${gr.baslik}</h4><ul class="mlz">${gr.liste.map(m=>{const v=ev.includes(m.k);return `<li class="${v?"var":""}" data-k="${m.k}"><button class="kutu" aria-label="Evde var">${v?"✓":""}</button><span class="ad">${m.n}</span><span class="m">${miktar(m.q,m.b)}</span></li>`}).join("")}</ul></div>`});
  h+=`<p class="not">Evde olan malzemenin kutusuna dokun: üstü çizilir, gönderilen listeye girmez.<br>Miktarlar ortalama ev tarifine göre; tuz, baharat ve su listede yok.</p>
  <div class="sat" style="margin-top:14px"><button class="dugme" id="kopyala">📋 Kopyala</button><button class="dugme ana" id="pdf">📄 PDF gönder</button></div>
  <div class="sat" style="margin-top:8px"><a class="dugme wa" id="wa" target="_blank" rel="noopener">💬 WhatsApp'ta gönder</a></div>
  <div class="sat" style="margin-top:8px"><button class="dugme" id="temizle" style="color:var(--kirmizi)">${D.kapsam==="hafta"?"Haftayı temizle":"Günü temizle"}</button></div>`;
  T.innerHTML=h;baglaUst(T);
  T.querySelectorAll("[data-sil]").forEach(b=>b.onclick=()=>{const [g,o,id]=b.dataset.sil.split("|");const s=gunS(g);s[o]=s[o].filter(x=>x!==id);kaydet();menuCiz()});
  T.querySelectorAll("[data-deg]").forEach(b=>b.onclick=()=>{const [g,o,id]=b.dataset.deg.split("|");degistir(g,o,id)});
  T.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{D.gorunum=b.dataset.g;kaydet();menuCiz()});
  T.querySelectorAll(".mlz li").forEach(li=>li.onclick=()=>{const k=li.dataset.k,a=evde();D.evde[evdeKey()]=a.includes(k)?a.filter(x=>x!==k):[...a,k];kaydet();menuCiz()});
  T.querySelector("#kopyala").onclick=kopyala;
  T.querySelector("#pdf").onclick=pdfGonder;
  T.querySelector("#wa").href="https://wa.me/?text="+encodeURIComponent(metin());
  T.querySelector("#temizle").onclick=e=>{const b=e.currentTarget;if(b.dataset.onay){gs.forEach(g=>delete D.hafta[g]);delete D.evde[evdeKey()];kaydet();menuCiz();tost("Temizlendi")}else{b.dataset.onay=1;b.textContent="Emin misin? Tekrar dokun"}};
}
function baglaUst(T){
  T.querySelector("#ke").onclick=()=>{if(D.kisi>1){D.kisi--;kaydet();menuCiz()}};
  T.querySelector("#ka").onclick=()=>{if(D.kisi<12){D.kisi++;kaydet();menuCiz()}};
  T.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{D.kapsam=b.dataset.k;kaydet();menuCiz()});
}

function metin(){
  const gs=kapsamGunleri(),ss=secimler(gs),ev=evde();
  let t=`🍽️ ${D.kapsam==="hafta"?"Haftalık menü":"Ev menüsü"} · ${kapsamBaslik()} (${D.kisi} kişi)\n`;
  gs.forEach(g=>{const gl=ss.filter(x=>x.g===g);if(!gl.length)return;
    if(D.kapsam==="hafta")t+=`\n📅 ${gunAdi(g)} (${kisaTarih(g)})`;
    OGUN.forEach(o=>{const l=gl.filter(x=>x.o===o[0]);if(l.length)t+=`\n${o[2]} ${o[1]}: ${l.map(x=>x.y.ad).join(", ")}`})});
  gruplar().forEach(gr=>{const l=gr.liste.filter(m=>!ev.includes(m.k));if(!l.length)return;t+=`\n\n${gr.ik} ${gr.baslik}:\n`+l.map(m=>`• ${m.n} – ${miktar(m.q,m.b)}`).join("\n")});
  return t;
}
async function kopyala(){
  const t=metin();
  try{await navigator.clipboard.writeText(t);tost("Kopyalandı, WhatsApp'a yapıştırabilirsin")}
  catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();tost(ok?"Kopyalandı":"Kopyalanamadı, metni elle seç")}
}
function pdfGonder(){
  if(!window.pdfMake||!pdfMake.vfs){tost("PDF aracı yüklenemedi, internet bağlantını kontrol et");return}
  const gs=kapsamGunleri(),ss=secimler(gs),ev=evde();
  const ic=[{text:D.kapsam==="hafta"?"Haftalık Menü":"Ev Menüsü",style:"b"},{text:`${kapsamBaslik()} · ${D.kisi} kişilik`,color:"#6B7180",margin:[0,0,0,14]}];
  gs.forEach(g=>{const gl=ss.filter(x=>x.g===g);if(!gl.length)return;
    if(D.kapsam==="hafta")ic.push({text:`${gunAdi(g)} · ${kisaTarih(g)}`,style:"g"});
    OGUN.forEach(o=>{const l=gl.filter(x=>x.o===o[0]);if(l.length)ic.push({text:[{text:o[1]+": ",bold:true},l.map(x=>x.y.ad).join(", ")],margin:[0,2,0,2]})})});
  gruplar().forEach(gr=>{const l=gr.liste.filter(m=>!ev.includes(m.k));if(!l.length)return;
    ic.push({text:gr.baslik,style:"a",margin:[0,14,0,6]});
    ic.push({table:{widths:[16,"*","auto"],body:l.map(m=>["☐",m.n,{text:miktar(m.q,m.b),alignment:"right"}])},layout:"lightHorizontalLines"})});
  ic.push({text:"Ailem · Ev Menüsü",fontSize:9,color:"#9AA0AE",margin:[0,20,0,0]});
  const dd={content:ic,defaultStyle:{fontSize:12},styles:{b:{fontSize:22,bold:true,color:"#FF7A59"},a:{fontSize:15,bold:true},g:{fontSize:14,bold:true,color:"#FF7A59",margin:[0,10,0,4]}},pageMargins:[36,36,36,36]};
  const ad=D.kapsam==="hafta"?`haftalik-menu-${pzt(D.gun)}.pdf`:`ev-menusu-${D.gun}.pdf`;
  pdfMake.createPdf(dd).getBlob(async blob=>{
    const f=new File([blob],ad,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Menü",text:"Menü ve malzeme listesi"});return}catch(e){if(e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=ad;document.body.appendChild(a);a.click();a.remove();
    tost("PDF indirildi; WhatsApp'ta 📎 → Belge ile gönderebilirsin");
  });
}
let tz;function tost(t){const e=$("#tost");e.textContent=t;e.classList.add("ac");clearTimeout(tz);tz=setTimeout(()=>e.classList.remove("ac"),2600)}

function cipGuncelle(){document.querySelectorAll(".cip").forEach(c=>c.classList.toggle("on",c.dataset.f===filtre))}
document.querySelectorAll(".cip").forEach(c=>c.onclick=()=>{filtre=c.dataset.f;cipGuncelle();ciz();scrollTo({top:0})});
ciz();
</script>
</body>
